candidate_min_hz: 80.0    # lowest plausible Sa (low male voice)
candidate_max_hz: 300.0   # highest plausible Sa (high female voice)
step_cents: 10.0          # search resolution (10 cents = fine grid)
bins_per_octave: 120      # 10-cent histogram bins
scoring_method: "sa_mass" # pure Sa-region mass (no entropy bonus)
min_voiced_frames: 200    # skip tracks with too little pitch data
